[package]
name = "windows-iso-validator"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Portable Windows ISO downloader and validator with MediaCreationTool.bat integration"
license = "MIT"
publish = false

[[bin]]
name = "WindowsISOValidator"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
cab = "0.6"
roxmltree = "0.21"
sha1 = "0.11"
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
rfd = "0.17"
humansize = "2"
log = "0.4"
open = "5"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"

# TLS: the Windows build uses the OS stack (schannel) so it needs no C toolchain and trusts the
# machine's certificate store (corporate proxies); other platforms use rustls.
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "gzip", "json", "charset", "http2", "system-proxy"] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "gzip", "json", "charset", "http2", "system-proxy"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
